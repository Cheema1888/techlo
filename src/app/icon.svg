<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111115" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Capsule / Circle -->
  <rect x="4" y="4" width="120" height="120" rx="36" fill="url(#bgGrad)" stroke="url(#glowRing)" stroke-width="4" />

  <!-- Robot Antenna -->
  <path d="M64 26 V16" stroke="url(#glowRing)" stroke-width="4" stroke-linecap="round" />
  <circle cx="64" cy="14" r="5" fill="#00F2FE" filter="url(#neonGlow)" />

  <!-- Robot Face Inner Screen -->
  <rect x="26" y="32" width="76" height="66" rx="18" fill="#18181D" stroke="#2E2E38" stroke-width="3" />

  <!-- Eyes (Cyan Neon Circuit Style) -->
  <rect x="40" y="52" width="14" height="14" rx="4" fill="#00F2FE" filter="url(#neonGlow)" />
  <rect x="74" y="52" width="14" height="14" rx="4" fill="#00F2FE" filter="url(#neonGlow)" />

  <!-- Cute Hardware Smile / Bus Trace -->
  <path d="M54 78 C59 82, 69 82, 74 78" stroke="#00F2FE" stroke-width="4" stroke-linecap="round" />

  <!-- Accent Hardware Ear Pins -->
  <rect x="18" y="54" width="5" height="18" rx="2" fill="#4FACFE" opacity="0.8" />
  <rect x="105" y="54" width="5" height="18" rx="2" fill="#4FACFE" opacity="0.8" />
</svg>
